name: Study 001 Anchoring Re-analysis

on:
  workflow_dispatch:
  push:
    branches:
      - agent/study-001-anchoring-reanalysis
    paths:
      - ".github/workflows/study-001-reanalysis.yml"
      - "scripts/reanalyse-study-001.py"
      - "research/studies/study-001/README.md"
  pull_request:
    paths:
      - ".github/workflows/study-001-reanalysis.yml"
      - "scripts/reanalyse-study-001.py"
      - "research/studies/study-001/**"

permissions:
  contents: write

jobs:
  reanalyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test analysis code
        run: python scripts/reanalyse-study-001.py --self-test
      - name: Re-analyse pinned public outputs
        run: python scripts/reanalyse-study-001.py
      - name: Show result summary
        run: cat research-output/study-001/report.md
      - name: Upload reproducible result artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-001-result
          path: research-output/study-001/
          if-no-files-found: error
          retention-days: 30
      - name: Persist verified result on study branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p research/studies/study-001/result
          cp research-output/study-001/summary.json research/studies/study-001/result/summary.json
          cp research-output/study-001/question-level.csv research/studies/study-001/result/question-level.csv
          cp research-output/study-001/report.md research/studies/study-001/result/report.md

          git config user.name "cognitive-biases-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/studies/study-001/result/summary.json research/studies/study-001/result/question-level.csv research/studies/study-001/result/report.md
          if git diff --cached --quiet; then
            echo "Study result is already current."
            exit 0
          fi
          git commit -m "Publish Study 001 re-analysis result"
          git push origin "HEAD:${GITHUB_REF_NAME}"

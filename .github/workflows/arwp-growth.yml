name: ARWP Growth Profile

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  growth-profile:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    env:
      ARWP_TARGET: https://cognitive-biases.github.io/
      SITE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      ARWP_REVISION: 28c9cc9b75fa2b17791b7b294b4249fa28496445
    steps:
      - name: Checkout pinned ARWP
        uses: actions/checkout@v7
        with:
          repository: dkharlanau/agent-ready-web-profile
          ref: ${{ env.ARWP_REVISION }}
          path: .arwp
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .arwp/package-lock.json

      - name: Install ARWP dependencies
        run: npm ci --prefix .arwp --ignore-scripts --no-audit --no-fund

      - name: Record audited revisions
        run: |
          git -C .arwp rev-parse HEAD | tee arwp-revision.txt
          printf '%s\n' "$SITE_REVISION" | tee site-revision.txt

      - name: Build current Growth Profile
        run: |
          node .arwp/bin/arwp-growth.mjs "$ARWP_TARGET" --json > arwp-growth.json
          node -e "const p=require('./arwp-growth.json'); console.log('ARWP Growth actions:', p.summary, 'owner data:', p.observations?.ownerData, 'optional opportunities:', p.opportunities?.length || 0);"

      - name: Upload Growth Profile
        uses: actions/upload-artifact@v6
        with:
          name: arwp-growth-profile
          path: |
            arwp-growth.json
            arwp-revision.txt
            site-revision.txt
          if-no-files-found: error
          retention-days: 30

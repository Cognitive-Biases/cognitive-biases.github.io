name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Google Search Pipeline"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Every production-capable trigger must share one lane. Otherwise a push and a
  # workflow_run can publish in parallel and the run that finishes last wins.
  # Pull requests only validate their own merge ref and never upload/deploy.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_run'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: timeout 90s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends webp
      - run: npm ci
      - run: npm run check
      - name: Install Google Tag Manager
        run: node scripts/inject-google-tag-manager.mjs
      - name: Publish ARWP discovery surface
        run: node scripts/apply-arwp.mjs
      - name: Apply ARWP Growth rollout
        run: node scripts/apply-growth-rollout.mjs
      - name: Restore latest Google Search owner report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .owner-data/google-search
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Google Search Pipeline" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name google-search-report --dir .owner-data/google-search
          fi
      - name: Publish bounded Growth owner-data receipt
        run: node scripts/publish-growth-owner-data.mjs .owner-data/google-search/google-indexing.json
      - name: Verify ARWP Growth rollout
        run: node scripts/check-growth-rollout.mjs
      - name: Verify Growth owner-data scope
        run: node scripts/check-growth-owner-data.mjs
      - name: Generate GitHub Pages 404
        run: node scripts/generate-404.mjs
      - name: Normalize final public metadata
        run: node scripts/finalize-public-metadata.mjs
      - name: Re-finalize homepage search identity
        run: node scripts/finalize-search-appearance.mjs
      - name: Re-apply Image Discovery to the final artifact
        run: node scripts/apply-image-discovery.mjs
      - name: Gate final Image Discovery surface
        run: node scripts/check-image-discovery.mjs
      - name: Gate final Technical SEO Critic surface
        run: node scripts/check-technical-seo-critic.mjs
      - name: Gate final public surface
        run: node scripts/check-final-public-surface.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed source revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live Technical SEO Critic headers
        run: node scripts/check-live-technical-seo-critic.mjs
      - name: Verify live Image Discovery surface
        run: node scripts/check-live-image-discovery.mjs

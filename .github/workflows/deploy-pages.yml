name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Google Search Pipeline"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Every production-capable trigger must share one lane. Otherwise a push and a
  # workflow_run can publish in parallel and the run that finishes last wins.
  # Pull requests only validate their own merge ref and never upload/deploy.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_run'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: timeout 90s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends webp
      - run: npm ci
      - name: Test staged live origin and redirect policy
        run: node --test scripts/lib/live-origin-policy.test.mjs
      - run: npm run check
      - name: Diagnose existing source and relay HTTP routes on PRs
        if: github.event_name == 'pull_request'
        run: |
          for url in \
            https://cognitive-biases.github.io/assets/editorial/biases/cognitive-bias-anchoring-effect.webp \
            https://cognitive-biases-move.vedokrok.com/assets/editorial/biases/cognitive-bias-anchoring-effect.webp \
            https://cognitive-biases-move.vedokrok.com/assets/editorial/biases/cognitive-bias-sunk-cost-effect.webp \
            https://cognitive-biases-move.vedokrok.com/assets/editorial/biases/confirmation-bias-congruence-bias.webp \
            https://cognitive-biases-move.vedokrok.com/reading.css \
            https://cognitive-biases-move.vedokrok.com/internal-discovery.js \
            https://cognitive-biases-move.vedokrok.com/favicon.png \
            https://cognitive-biases-move.vedokrok.com/data/image-discovery.json \
            https://raw.githubusercontent.com/Cognitive-Biases/cognitive-biases.github.io/main/public/assets/editorial/biases/cognitive-bias-anchoring-effect.webp \
            https://cognitive-biases-move.vedokrok.com/biases/heuristic-bias-availability-bias/ \
            https://cognitive-biases-move.vedokrok.com/biases/cognitive-rigidity-functional-fixedness/ \
            https://cognitive-biases-move.vedokrok.com/biases/cognitive-bias-outcome-bias/ \
            https://cognitive-biases-move.vedokrok.com/biases/prospect-theory-status-quo-bias/; do
            printf 'Route: %s\\n' "$url"
            curl --silent --show-error --max-time 20 --output /dev/null \
              --write-out 'direct_status=%{http_code} direct_location=%{redirect_url} content_type=%{content_type}\\n' "$url" || true
            curl --silent --show-error --max-time 20 --location --max-redirs 5 --output /dev/null \
              --write-out 'final_status=%{http_code} final_url=%{url_effective} redirects=%{num_redirects} content_type=%{content_type}\\n' "$url" || true
          done
      - name: Smoke-check current public relay on PRs
        if: github.event_name == 'pull_request'
        run: |
          failed=0
          for check in \
            scripts/check-live-technical-seo-critic.mjs \
            scripts/check-live-image-discovery.mjs \
            scripts/check-live-internal-discovery-distribution.mjs \
            scripts/check-live-localization.mjs; do
            echo "Checking $check"
            node "$check" || failed=1
          done
          exit "$failed"
      - name: Install Google Tag Manager
        run: node scripts/inject-google-tag-manager.mjs
      - name: Publish ARWP discovery surface
        run: node scripts/apply-arwp.mjs
      - name: Finalize localized AI routing
        run: node scripts/finalize-localized-ai-routing.mjs
      - name: Apply ARWP Growth rollout
        run: node scripts/apply-growth-rollout.mjs
      - name: Restore latest Google Search owner report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .owner-data/google-search
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Google Search Pipeline" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name google-search-report --dir .owner-data/google-search
          fi
      - name: Publish bounded Growth owner-data receipt
        run: node scripts/publish-growth-owner-data.mjs .owner-data/google-search/google-indexing.json
      - name: Verify ARWP Growth rollout
        run: node scripts/check-growth-rollout.mjs
      - name: Verify Growth owner-data scope
        run: node scripts/check-growth-owner-data.mjs
      - name: Generate GitHub Pages 404
        run: node scripts/generate-404.mjs
      - name: Normalize final public metadata
        run: node scripts/finalize-public-metadata.mjs
      - name: Re-finalize homepage search identity
        run: node scripts/finalize-search-appearance.mjs
      - name: Stage Goose ARWP Proof Mark
        run: node scripts/inject-goose-proof-mark.mjs dist
      - name: Re-apply Image Discovery to the final artifact
        run: node scripts/apply-image-discovery.mjs
      - name: Finalize browser surface
        run: node scripts/finalize-browser-surface.mjs
      - name: Gate final Image Discovery surface
        run: node scripts/check-image-discovery.mjs
      - name: Gate final Internal Discovery & Distribution surface
        run: node scripts/check-internal-discovery-distribution.mjs
      - name: Gate RSS feed syndication surface
        run: node scripts/check-feed-syndication.mjs
      - name: Gate final Technical SEO Critic surface
        run: node scripts/check-technical-seo-critic.mjs
      - name: Gate Search 2026 localization policy
        run: node scripts/check-search-localization-policy.mjs
      - name: Gate final localization product contract
        run: node scripts/check-localization-closure.mjs
      - name: Gate complete canonical crawl graph and honest sitemap freshness
        run: npm run check:crawl-reachability
      - name: Gate final public surface
        run: node scripts/check-final-public-surface.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed source revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live Technical SEO Critic headers
        run: node scripts/check-live-technical-seo-critic.mjs
      - name: Verify live Image Discovery surface
        run: node scripts/check-live-image-discovery.mjs
      - name: Verify live Internal Discovery & Distribution surface
        run: node scripts/check-live-internal-discovery-distribution.mjs
      - name: Verify live localization product contract
        run: node scripts/check-live-localization.mjs

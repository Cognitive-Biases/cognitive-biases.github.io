name: Localization Browser Verification

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "public/**"
      - ".arwp/**"
      - ".github/workflows/localization-browser.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: timeout 90s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends webp
      - run: npm ci
      - name: Build final local artifact
        run: npm run build
      - name: Install pinned browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          node scripts/serve.mjs > /tmp/cognitive-biases-browser-server.log 2>&1 &
          echo $! > /tmp/cognitive-biases-browser-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cognitive-biases-browser-server.log
          exit 1
      - name: Audit rendered local localization surface
        id: local_audit
        continue-on-error: true
        env:
          TARGET_BASE_URL: http://127.0.0.1:4173
          BROWSER_AUDIT_MODE: local
          BROWSER_FULL_SCAN: "1"
          BROWSER_FULL_SCAN_CONCURRENCY: "6"
        run: node scripts/browser-localization-audit.mjs
      - name: Capture current production browser baseline
        id: production_baseline
        continue-on-error: true
        env:
          TARGET_BASE_URL: https://cognitive-biases.github.io
          BROWSER_AUDIT_MODE: production-baseline
          BROWSER_FULL_SCAN: "0"
          BROWSER_MAX_ARCHETYPES: "10"
        run: node scripts/browser-localization-audit.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-browser-evidence
          path: .artifacts/localization-browser
          if-no-files-found: error
          retention-days: 14
      - name: Gate local browser findings
        if: always()
        run: |
          if [[ "${{ steps.local_audit.outcome }}" != "success" ]]; then
            echo "Local browser localization audit found high/critical defects. See localization-browser-evidence."
            exit 1
          fi

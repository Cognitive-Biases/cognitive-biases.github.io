name: Localization governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate localization governance
        run: node scripts/check-localization-governance.mjs

      - name: Build localized site surfaces
        run: npm run build:site

      - name: Check French localization
        run: npm run check:french-localization

      - name: Check French skills
        run: npm run check:french-skills

      - name: Check Brazilian Portuguese localization
        run: npm run check:portuguese-localization

      - name: Check Spanish localization
        run: npm run check:spanish-localization

      - name: Check Spanish skills
        run: npm run check:spanish-skills

      - name: Check German and Russian scoped localization
        run: npm run check:de

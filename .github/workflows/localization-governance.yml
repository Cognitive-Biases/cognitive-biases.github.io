name: Localization governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate localization governance
        run: node scripts/check-localization-governance.mjs

      - name: Run locale-specific localization checks
        run: |
          npm run build:site
          npm run check:french-localization
          npm run check:french-skills
          npm run check:portuguese-localization
          npm run check:spanish-localization
          npm run check:spanish-skills
          npm run check:de

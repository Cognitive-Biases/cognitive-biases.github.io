name: Localization governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install WebP encoder
        run: timeout 90s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends webp

      - name: Install dependencies
        run: npm ci

      - name: Validate localization governance
        run: node scripts/check-localization-governance.mjs

      - name: Run canonical repository quality suite
        run: npm run check

      - name: Project localization exceptions to ARWP Quality Debt
        run: node scripts/project-arwp-localization-debt.mjs

      - name: Checkout pinned Goose ARWP
        uses: actions/checkout@v6
        with:
          repository: dkharlanau/agent-ready-web-profile
          ref: 6a8168b854ed6f557f5906808a83eb67be9f42ea
          path: .arwp-tool
          persist-credentials: false

      - name: Install Goose ARWP dependencies
        run: npm ci --prefix .arwp-tool

      - name: Run generic ARWP localization check
        run: node .arwp-tool/bin/arwp.mjs localization check .arwp/localization.json --root=. --json > /tmp/arwp-localization-report.json

      - name: Run generic ARWP localization impact gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:-main}"
          node .arwp-tool/bin/arwp.mjs localization gate .arwp/localization.json --root=. --base="origin/${base}" --head=HEAD

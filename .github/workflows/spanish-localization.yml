name: Spanish localization

on:
  pull_request:
    paths:
      - 'data/*es*.json'
      - 'data/locales.json'
      - 'ai/llms.es.txt'
      - 'ai/locales.json'
      - 'scripts/*spanish*.mjs'
      - 'scripts/lib/spanish-translations.mjs'
      - 'public/es.css'
      - 'docs/localization-es.md'
      - 'docs/translation-state.md'
      - 'package.json'
      - '.github/workflows/spanish-localization.yml'
  push:
    branches: [main]
    paths:
      - 'data/*es*.json'
      - 'data/locales.json'
      - 'ai/llms.es.txt'
      - 'ai/locales.json'
      - 'scripts/*spanish*.mjs'
      - 'scripts/lib/spanish-translations.mjs'
      - 'public/es.css'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: spanish-localization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare canonical data
        run: npm run prepare:data
      - name: Build site and localized layers
        run: npm run build:site
      - name: Validate Spanish localization
        run: npm run check:spanish-localization
      - name: Validate Spanish decision skills
        run: npm run check:spanish-skills
      - name: Protect French reciprocal localization
        run: npm run check:french-localization && npm run check:french-skills
      - name: Run core site integrity check
        run: node scripts/check.mjs

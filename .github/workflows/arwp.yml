name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'data/**'
      - 'schemas/**'
      - 'integrations/mcp/**'
      - 'SECURITY.md'
      - 'scripts/apply-arwp.mjs'
      - 'scripts/check-arwp-layers.mjs'
      - '.github/workflows/arwp.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'data/**'
      - 'schemas/**'
      - 'integrations/mcp/**'
      - 'SECURITY.md'
      - 'scripts/apply-arwp.mjs'
      - 'scripts/check-arwp-layers.mjs'
      - '.github/workflows/arwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@c1d51698e3765d0817ee14bcbc36c67297457260
        with:
          profile: ai/site-profile.json

      - name: Validate Cognitive Biases ARWP layers
        run: node scripts/check-arwp-layers.mjs

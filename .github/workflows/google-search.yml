name: Google Search Pipeline
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/google-search.yml
      - scripts/probe-google-search-appearance.py
  workflow_dispatch:
    inputs:
      max_inspections: { description: Maximum page URLs to inspect, required: false, default: 500, type: number }
      inspection_mode: { description: URL selection mode, required: false, default: all, type: choice, options: [all, priority, rotate] }
  schedule: [{ cron: "41 5 * * *" }]
permissions: { contents: read, actions: read }
jobs:
  google-search:
    uses: dkharlanau/dkharlanau.github.io/.github/workflows/google-search-reusable.yml@88f3a30a721d762517a179c9ebe93526792b6065
    with:
      site_url: https://cognitive-biases.github.io/
      sitemap_url: https://cognitive-biases.github.io/sitemap.xml
      runner_ref: 88f3a30a721d762517a179c9ebe93526792b6065
      max_inspections: ${{ github.event_name == 'schedule' && 120 || github.event_name == 'workflow_dispatch' && inputs.max_inspections || 20 }}
      inspection_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.inspection_mode || 'rotate' }}
    secrets:
      google_search_console_service_account: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}

  search-appearance-probe:
    needs: google-search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google authentication client
        run: python -m pip install "google-auth[requests]>=2.35,<3"
      - name: Prepare read-only Search Console credentials
        id: credentials
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_ACCOUNT_JSON:-}" || { echo "::error::GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT is not configured."; exit 1; }
          credentials_path="$RUNNER_TEMP/google-search-console.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$credentials_path"
          echo "path=$credentials_path" >> "$GITHUB_OUTPUT"
      - name: Probe Search Analytics appearance values
        run: |
          python scripts/probe-google-search-appearance.py \
            --site-url https://cognitive-biases.github.io/ \
            --credentials "${{ steps.credentials.outputs.path }}" \
            --days 90 \
            --output reports/seo/google-search/search-appearance-probe.json
      - name: Upload Search appearance probe
        uses: actions/upload-artifact@v4
        with:
          name: google-search-appearance-probe
          path: reports/seo/google-search/search-appearance-probe.json
          if-no-files-found: error
          retention-days: 30

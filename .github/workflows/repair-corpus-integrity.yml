name: Repair corpus integrity

on:
  push:
    branches: [main, agent/taxonomy-audit]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repair-integrity.mjs --write
      - run: node scripts/validate-data.mjs
      - name: Commit repaired data
        shell: bash
        run: |
          if git diff --quiet -- data/biases.json; then
            echo "No corpus changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/biases.json
          git commit -m "Repair corpus data integrity"
          git push origin HEAD:${{ github.ref_name }}

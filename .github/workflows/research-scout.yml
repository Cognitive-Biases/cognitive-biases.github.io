name: Research Scout

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-scout.yml"
      - "scripts/research-scout.mjs"
      - "data/research-scout-config.json"

permissions:
  contents: write

concurrency:
  group: research-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate scout
        run: node scripts/research-scout.mjs --self-test
      - name: Discover research candidates
        run: node scripts/research-scout.mjs
      - name: Persist research inbox
        shell: bash
        run: |
          if git diff --quiet -- data/research-inbox.json; then
            echo "No new research candidates to persist."
            exit 0
          fi

          git config user.name "cognitive-biases-research-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research-inbox.json
          git commit -m "Scout recent cognitive-bias research"

          if git push origin HEAD:main; then
            echo "Research inbox updated on main. Public evidence and content were not changed."
            exit 0
          fi

          branch="research-scout/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "::warning::Main rejected the inbox update. A fallback branch was pushed: $branch"

name: Localization quality

on:
  pull_request:
    paths:
      - 'data/**'
      - 'ai/**'
      - 'skills/**'
      - 'docs/localization*.md'
      - 'index.html'
      - 'assets/**'
      - 'scripts/build-*.mjs'
      - 'scripts/generate-*.mjs'
      - 'scripts/enhance-*.mjs'
      - 'scripts/apply-*.mjs'
      - 'scripts/finalize-*.mjs'
      - 'scripts/check-french-localization.mjs'
      - 'scripts/check-french-skills.mjs'
      - 'scripts/check-portuguese-localization.mjs'
      - 'scripts/check-localization*.mjs'
      - 'package.json'
      - '.github/workflows/localization-quality.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'ai/**'
      - 'skills/**'
      - 'docs/localization*.md'
      - 'index.html'
      - 'assets/**'
      - 'scripts/build-*.mjs'
      - 'scripts/generate-*.mjs'
      - 'scripts/enhance-*.mjs'
      - 'scripts/apply-*.mjs'
      - 'scripts/finalize-*.mjs'
      - 'scripts/check-french-localization.mjs'
      - 'scripts/check-french-skills.mjs'
      - 'scripts/check-portuguese-localization.mjs'
      - 'scripts/check-localization*.mjs'
      - 'package.json'
      - '.github/workflows/localization-quality.yml'

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check localization scripts syntax
        run: |
          node --check scripts/check-localization.mjs
          node --check scripts/check-localization-impact.mjs
      - name: Build final localized surfaces
        run: npm run build
      - name: Verify French localization
        run: npm run check:french-localization
      - name: Verify French Decision Skills
        run: npm run check:french-skills
      - name: Verify Brazilian Portuguese localization
        run: npm run check:portuguese-localization
      - name: Verify shared localization contract
        run: npm run check:localization
      - name: Verify localization impact
        if: github.event_name == 'pull_request'
        run: npm run check:localization-impact -- --base=origin/${{ github.base_ref }}

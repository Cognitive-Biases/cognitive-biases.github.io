name: German Corpus Quality

on:
  push:
    branches: [deep-run/de-full-corpus]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  german-corpus-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: timeout 90s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends webp
      - run: npm ci
      - name: Prepare canonical corpus and verify German source parity
        run: npm run prepare:data && node scripts/check-de-corpus-parity.mjs
      - name: Run full repository checks
        run: npm run check

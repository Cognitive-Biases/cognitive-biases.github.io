name: Data or schema bug
description: Report broken JSON, schema drift, invalid IDs or integration regressions.
title: "[Data] "
labels: []
body:
  - type: input
    id: release
    attributes:
      label: Release version
      placeholder: "2026.08.18"
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File, schema or endpoint
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction

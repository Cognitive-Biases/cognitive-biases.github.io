name: Source suggestion
description: Suggest a paper or review for an existing concept.
title: "[Source] "
labels: []
body:
  - type: input
    id: concept
    attributes:
      label: Canonical concept ID or page
    validations:
      required: true
  - type: input
    id: identifier
    attributes:
      label: DOI, PMID or stable URL
    validations:
      required: true
  - type: textarea
    id: supports
    attributes:
      label: What does this source support or challenge?
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Population, task, measurement or other limits
